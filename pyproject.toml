[project]
name = "spar"
version = "0.1.0"
description = "Structured Parallel Automated Research"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]

[project.scripts]
spar = "spar.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["-n", "auto"]
